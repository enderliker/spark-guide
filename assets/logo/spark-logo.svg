<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Spark</title>
  <desc id="d">Logo del lenguaje Spark: una S de bloques apilados encendida por una chispa, junto al nombre en minúsculas.</desc>
  <defs>
    <style>
      .ink { fill: none; stroke: #1b2025; stroke-width: 20; stroke-linejoin: miter; stroke-linecap: butt; stroke-miterlimit: 10; }
      @media (prefers-color-scheme: dark) { .ink { stroke: #eef1f3; } .tile-edge { stroke: #3a434b; } }
    </style>
    <linearGradient id="ember" gradientUnits="userSpaceOnUse" x1="0" y1="75" x2="0" y2="245">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="0.55" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#E8412A"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <path id="star" d="M0 -100 C7 -35 35 -7 100 0 C35 7 7 35 0 100 C-7 35 -35 7 -100 0 C-35 -7 -7 -35 0 -100 Z"/>
    <clipPath id="kband"><rect x="790" y="110" width="120" height="100"/></clipPath>
  </defs>

  <!-- Icono -->
  <rect class="tile-edge" x="1" y="1" width="318" height="318" rx="72" fill="#1b2025" stroke="none"/>
  <g>
    <path d="M200 92 H100 V160 H220 V228 H100" fill="none" stroke="url(#ember)" stroke-width="34" stroke-linejoin="miter" stroke-linecap="butt"/>
    <circle cx="240" cy="92" r="64" fill="url(#glow)"/>
    <use href="#star" transform="translate(240 92) scale(0.34)" fill="#FFF1C9"/>
    <use href="#star" transform="translate(284 142) scale(0.11)" fill="#FFD36B"/>
  </g>

  <!-- Wordmark: s p a r k -->
  <g class="ink">
    <path d="M440 120 H380 V160 H430 V200 H370"/>
    <path d="M480 110 V270"/>
    <path d="M480 120 H540 V200 H480"/>
    <path d="M580 120 H650 V200 H590 V160 H650"/>
    <path d="M700 110 V210"/>
    <path d="M700 120 H750 V150"/>
    <path d="M800 55 V210"/>
    <g clip-path="url(#kband)">
      <path d="M804 171 L868 107"/>
      <path d="M826 146 L872 220"/>
    </g>
  </g>
</svg>
